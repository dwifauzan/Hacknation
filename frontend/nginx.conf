# Nginx untuk frontend Vite (SPA) + reverse proxy ke backend.
# Memungkinkan browser memakai SATU origin (http://localhost:3000)
# tanpa masalah CORS:
#   /api/* → Laravel  (http://laravel-app:8000/api/)
#   /wa/*  → Go WA    (http://whatsapp-service:8080/)
#   /ws    → Go WS    (websocket upgrade)
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — semua route frontend kembali ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel business API + proxy whatsapp (/api/whatsapp/*)
    location /api/ {
        proxy_pass http://laravel-app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel proxy non-API (opsional): /whatsapp/*, /kirim-pesan
    location /whatsapp/ {
        proxy_pass http://laravel-app:8000/whatsapp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Go WA service REST via satu origin (alternatif direct :8080)
    location /wa/ {
        proxy_pass http://whatsapp-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Go WebSocket realtime
    location /ws {
        proxy_pass http://whatsapp-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
